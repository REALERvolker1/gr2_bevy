[package]
name = "gr2-controller"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_window", "bevy_winit", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "png", "x11", "tonemapping_luts", "zstd_rust"] }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
